name: Apply requested binder update
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-binder-update.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact requested changes
        run: python apply_binder_update.py
      - name: Commit updated binder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes needed"
          else
            git commit -m "Add Today list controls remove money card and connect Supabase sync"
            git push
          fi
