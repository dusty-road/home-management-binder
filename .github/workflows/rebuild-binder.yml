name: Rebuild Binder
on:
  push:
    paths:
      - '.binder-payload/**'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files=[Path(f'.binder-payload/part{i:02d}.txt') for i in range(1,10)]
          if not all(p.exists() for p in files):
              print('Waiting for all binder parts')
              raise SystemExit(0)
          html=''.join(p.read_text() for p in files)
          Path('index.html').write_text(html)
          PY
      - name: Commit rebuilt binder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update home management binder"
          git push
