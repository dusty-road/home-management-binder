name: Apply requested binder changes
on:
  push:
    paths:
      - '.github/workflows/apply-requested-ui.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild binder
        run: |
          cat .ui-deploy/chunk01.gz.b64 .ui-deploy/chunk02.gz.b64 .ui-deploy/chunk03.gz.b64 .ui-deploy/chunk04.gz.b64 .ui-deploy/chunk05.gz.b64 .ui-deploy/chunk06.gz.b64 .ui-deploy/chunk07.gz.b64 .ui-deploy/chunk08.gz.b64 > /tmp/site.b64
          base64 -d /tmp/site.b64 | gzip -d > index.html
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Apply requested clock birthdays tabs and inventory changes
          file_pattern: index.html
